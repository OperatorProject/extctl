[package]
name = "extctl"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "A distro-independent wrapper over systemd-sysext for signing and installing system extensions"

[dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
